[package]
name = "allmusic-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
librespot-core = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = { version = "0.8.0", default-features = false, features = ["rodio-backend", "native-tls"] }
librespot-metadata = "0.8.0"
librespot-protocol = "0.8.0"
protobuf = "3"
http = "1"
futures-util = "0.3"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
